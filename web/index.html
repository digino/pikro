<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikro</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Apply the saved theme before first paint; stores/theme.ts takes over once the app boots. -->
    <script>
      try {
        if (localStorage.getItem('pikro-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
