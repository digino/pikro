<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logged out</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #f9fafb; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 2rem;
    width: 100%; max-width: 360px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    display: flex; flex-direction: column; gap: 1.25rem;
  }
  .logo { display: flex; align-items: center; gap: .5rem; justify-content: center; }
  .logo svg { width: 20px; height: 20px; color: #111827; }
  .logo-text { font-size: .875rem; font-weight: 700; color: #111827; letter-spacing: -.03em; }
  h1 { font-size: 1rem; font-weight: 600; color: #111827; text-align: center; }
  .rows { display: flex; flex-direction: column; gap: .5rem; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: .8125rem; }
  .row .lbl { color: #9ca3af; }
  .row .val { font-weight: 500; color: #111827; font-variant-numeric: tabular-nums; }
  .btn {
    display: block; width: 100%; padding: .625rem 1rem;
    background: #111827; color: #fff; border: none; border-radius: 8px;
    font-size: .875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: filter .15s;
    text-align: center; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.15); }
  .footer { font-size: .7rem; color: #d1d5db; text-align: center; }
</style>
<script>
  function openLogin() {
    if (window.name !== 'hotspot_logout') return true;
    open('$(link-login)', '_blank', '');
    window.close();
    return false;
  }
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-text">pikro</span>
  </div>
  <h1>You are logged out</h1>
  <div class="rows">
    <div class="row"><span class="lbl">Username</span><span class="val">$(username)</span></div>
    <div class="row"><span class="lbl">Session time</span><span class="val">$(uptime)</span></div>
    $(if session-time-left)
    <div class="row"><span class="lbl">Time left</span><span class="val">$(session-time-left)</span></div>
    $(endif)
    <div class="row"><span class="lbl">Data used</span><span class="val">↑ $(bytes-in-nice) / ↓ $(bytes-out-nice)</span></div>
  </div>
  <form action="$(link-login)" name="login" onsubmit="return openLogin()">
    <button type="submit" class="btn">Sign in again</button>
  </form>
  <p class="footer">Powered by Pikro</p>
</div>
</body>
</html>
