name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  # Mac builds run on macos-latest so iconutil and .app bundling are available.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci
      - run: cd web && npm run build

      - name: Verify frontend build output
        run: |
          if [ ! -s web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing or empty — Vite build likely failed silently. Refusing to embed a blank frontend."
            exit 1
          fi

      - name: Build Mac binaries + .app bundles
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          mkdir -p dist
          # systray uses cgo (Objective-C) on macOS, so CGO must stay enabled
          # even when cross-compiling for the non-native arch — Go disables
          # cgo by default whenever GOOS/GOARCH differ from the host, which
          # silently drops the cgo-implemented systray functions and fails
          # with "undefined: nativeLoop" etc. macOS's system clang is a
          # universal compiler, so passing -arch/-target for the target arch
          # is enough for it to cross-compile the Objective-C side too.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o dist/.pikro-mac-arm64-bin .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" \
            CGO_LDFLAGS="-arch x86_64" \
            go build -ldflags "-X main.Version=${VERSION}" -o dist/.pikro-mac-intel-bin .
          make _bundle_app BIN=dist/.pikro-mac-arm64-bin  OUT=dist/Pikro-mac-arm64.zip  VERSION=${VERSION}
          make _bundle_app BIN=dist/.pikro-mac-intel-bin  OUT=dist/Pikro-mac-intel.zip  VERSION=${VERSION}
          rm -f dist/.pikro-mac-arm64-bin dist/.pikro-mac-intel-bin

      - uses: actions/upload-artifact@v4
        with:
          name: mac-zips
          path: |
            dist/Pikro-mac-arm64.zip
            dist/Pikro-mac-intel.zip

  # Windows and Linux build on ubuntu-latest — faster and cheaper.
  build-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci
      - run: cd web && npm run build

      - name: Verify frontend build output
        run: |
          if [ ! -s web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing or empty — Vite build likely failed silently. Refusing to embed a blank frontend."
            exit 1
          fi

      - name: Generate Windows resources (manifest + icon)
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -manifest pikro.exe.manifest \
            -ico assets/brand/pikro.ico \
            -arch amd64 \
            -o rsrc_windows_amd64.syso

      - name: Build Windows + Linux binaries
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION} -H windowsgui" -o dist/pikro.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o dist/pikro-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o dist/pikro-linux-arm64 .

      - uses: actions/upload-artifact@v4
        with:
          name: other-binaries
          path: |
            dist/pikro.exe
            dist/pikro-linux-amd64
            dist/pikro-linux-arm64

  # Release job waits for both builds, tags, then publishes everything.
  release:
    needs: [build-mac, build-other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          name: mac-zips
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: other-binaries
          path: dist/

      # Cryptographically attests these exact files were built by this exact
      # workflow run from this exact commit — verifiable via
      # `gh attestation verify <file> -R digino/pikro`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/Pikro-mac-arm64.zip
            dist/Pikro-mac-intel.zip
            dist/pikro.exe
            dist/pikro-linux-amd64
            dist/pikro-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/Pikro-mac-arm64.zip
            dist/Pikro-mac-intel.zip
            dist/pikro.exe
            dist/pikro-linux-amd64
            dist/pikro-linux-arm64
