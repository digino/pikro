name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  # Mac builds run on macos-latest so iconutil and .app bundling are available.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci
      - run: cd web && npm run build

      - name: Verify frontend build output
        run: |
          if [ ! -s web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing or empty — Vite build likely failed silently. Refusing to embed a blank frontend."
            exit 1
          fi

      - name: Build Mac binary + .app bundle
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          mkdir -p dist
          # systray uses cgo (Objective-C) on macOS — CGO must stay enabled.
          # -s -w strips debug symbols/DWARF tables — ~30% smaller binary,
          # no functional loss for a distributed build.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.Version=${VERSION}" -o dist/.pikro-mac-arm64-bin .
          # _bundle_app also ad-hoc-signs the .app (no paid Apple Developer ID
          # yet, so identity "-": locally generated, not tied to any Apple
          # account). Satisfies Apple Silicon's requirement that binaries be
          # signed at all, but does NOT notarize the app or clear the
          # Gatekeeper quarantine flag — first run still needs `xattr -cr`
          # (see README).
          make _bundle_app BIN=dist/.pikro-mac-arm64-bin  OUT=dist/Pikro-mac-arm64.dmg  VERSION=${VERSION}
          rm -f dist/.pikro-mac-arm64-bin

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            dist/Pikro-mac-arm64.dmg

  # Windows builds on ubuntu-latest — faster and cheaper.
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci
      - run: cd web && npm run build

      - name: Verify frontend build output
        run: |
          if [ ! -s web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing or empty — Vite build likely failed silently. Refusing to embed a blank frontend."
            exit 1
          fi

      - name: Generate Windows resources (manifest + icon)
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -manifest pikro.exe.manifest \
            -ico assets/brand/pikro.ico \
            -arch amd64 \
            -o rsrc_windows_amd64.syso

      - name: Build Windows binary
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          mkdir -p dist
          # -s -w strips debug symbols/DWARF tables — ~30% smaller binary,
          # no functional loss for a distributed build.
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${VERSION} -H windowsgui" -o dist/pikro.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            dist/pikro.exe

  # Release job waits for both builds, tags, then publishes everything.
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/

      # Cryptographically attests these exact files were built by this exact
      # workflow run from this exact commit — verifiable via
      # `gh attestation verify <file> -R digino/pikro`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/Pikro-mac-arm64.dmg
            dist/pikro.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/Pikro-mac-arm64.dmg
            dist/pikro.exe
